name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived publish token
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "[Release] tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "[Release] $GITHUB_REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi
      - run: npm run check
      - name: Use an npm with trusted publishing
        run: npm install -g npm@11
      - run: npm publish
